<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Sharer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="main">
      <button id="copy" type="button" class="button">Copy</button>
      <hr class="break" />
      <div id="template-picker" class="inputs"></div>
      <div id="inputs" class="inputs"></div>
      <label for="output" class="label">Output</label>
      <textarea id="output" readonly class="textarea"></textarea>
      <button id="settings" type="button" class="link-button">⚙ Edit templates</button>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
